name: Android Debug APK Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Cancel redundant in-progress runs on the same branch or PR
concurrency:
  group: android-debug-build-${{ github.ref }}
  cancel-in-progress: true

# Strict least-privilege token permissions
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  BUN_VERSION: '1.4.4'
  JAVA_VERSION: '21'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  EXPECTED_APP_ID: 'com.snakearena.arcade'
  GRADLE_JVM_ARGS: '-Xmx3072m -XX:MaxMetaspaceSize=768m'

jobs:
  build-android-debug-apk:
    name: Build & Verify Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Detect package manager and lockfile
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "bun.lock" ]; then
            echo "pm=bun" >> "$GITHUB_OUTPUT"
            echo "lockfile=bun.lock" >> "$GITHUB_OUTPUT"
            echo "cache_dir=$HOME/.bun/install/cache" >> "$GITHUB_OUTPUT"
          elif [ -f "package-lock.json" ]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
            echo "cache_dir=$HOME/.npm" >> "$GITHUB_OUTPUT"
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
            echo "cache_dir=$HOME/.local/share/pnpm/store" >> "$GITHUB_OUTPUT"
          elif [ -f "yarn.lock" ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
            echo "cache_dir=$HOME/.cache/yarn" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No supported lockfile found (expected bun.lock, package-lock.json, pnpm-lock.yaml, or yarn.lock)."
            exit 1
          fi

      - name: Cache JavaScript package store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pkg.outputs.cache_dir }}
          key: ${{ runner.os }}-${{ steps.pkg.outputs.pm }}-${{ hashFiles(steps.pkg.outputs.lockfile) }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.pkg.outputs.pm }}-

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.pkg.outputs.pm }}" in
            bun)
              bun install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
            pnpm)
              corepack enable
              pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable
              yarn install --frozen-lockfile
              ;;
          esac

      - name: Run dependency security audit
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.pkg.outputs.pm }}" in
            bun)
              bun audit --audit-level=high
              ;;
            npm)
              npm audit --omit=dev --audit-level=high
              ;;
            pnpm)
              pnpm audit --prod --audit-level=high
              ;;
            yarn)
              yarn npm audit --severity high || true
              ;;
          esac

      - name: Run TypeScript type check
        shell: bash
        run: npm run lint

      - name: Build production web assets
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          if [ ! -s "dist/index.html" ]; then
            echo "::error::Production web build failed: dist/index.html is missing or empty."
            exit 1
          fi
          if [ ! -d "dist/assets" ]; then
            echo "::error::Production web build failed: dist/assets directory is missing."
            exit 1
          fi
          ls -lh dist/

      - name: Verify existing Android project and sync Capacitor
        shell: bash
        run: |
          set -euo pipefail
          for required_file in "android/settings.gradle" "android/build.gradle" "android/app/build.gradle" "android/gradlew"; do
            if [ ! -f "$required_file" ]; then
              echo "::error::Expected committed Android project file is missing: $required_file"
              exit 1
            fi
          done

          npx cap sync android

          if [ ! -s "android/app/src/main/assets/public/index.html" ]; then
            echo "::error::Capacitor sync did not populate android/app/src/main/assets/public/index.html."
            exit 1
          fi
          if [ ! -s "android/app/src/main/assets/capacitor.config.json" ]; then
            echo "::error::Capacitor sync did not generate android/app/src/main/assets/capacitor.config.json."
            exit 1
          fi

      - name: Set up JDK ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Android SDK ${{ env.ANDROID_COMPILE_SDK }} and Build-Tools ${{ env.ANDROID_BUILD_TOOLS }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found at $SDK_ROOT."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager binary not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          MISSING_PKGS=()
          if [ ! -d "$SDK_ROOT/platforms/android-${ANDROID_COMPILE_SDK}" ]; then
            MISSING_PKGS+=("platforms;android-${ANDROID_COMPILE_SDK}")
          fi
          if [ ! -d "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}" ]; then
            MISSING_PKGS+=("build-tools;${ANDROID_BUILD_TOOLS}")
          fi

          if [ ${#MISSING_PKGS[@]} -gt 0 ]; then
            echo "Installing missing Android SDK packages: ${MISSING_PKGS[*]}"
            "$SDKMANAGER" --install "${MISSING_PKGS[@]}"
          else
            echo "Android SDK platform ${ANDROID_COMPILE_SDK} and build-tools ${ANDROID_BUILD_TOOLS} already installed."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        shell: bash
        run: chmod +x android/gradlew

      - name: Run Android unit tests
        working-directory: android
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace -Dorg.gradle.jvmargs="${GRADLE_JVM_ARGS}"

      - name: Run Android Lint checks
        working-directory: android
        shell: bash
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="${GRADLE_JVM_ARGS}"

      - name: Build Android Debug APK
        working-directory: android
        shell: bash
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="${GRADLE_JVM_ARGS}"

      - name: Verify Debug APK integrity and metadata
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Expected Debug APK is missing or empty at $APK_PATH."
            exit 1
          fi

          AAPT2="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          if [ ! -x "$AAPT2" ]; then
            AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$AAPT2" ] || [ ! -x "$AAPT2" ]; then
            echo "::error::aapt2 tool not found under $ANDROID_HOME/build-tools."
            exit 1
          fi

          BADGING="$("$AAPT2" dump badging "$APK_PATH")"
          PKG_LINE="$(echo "$BADGING" | grep -m1 '^package:')"
          echo "APK Metadata: $PKG_LINE"

          PKG_NAME="$(echo "$PKG_LINE" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(echo "$PKG_LINE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(echo "$PKG_LINE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"

          if [ "$PKG_NAME" != "$EXPECTED_APP_ID" ]; then
            echo "::error::APK package ID mismatch. Expected '$EXPECTED_APP_ID', got '$PKG_NAME'."
            exit 1
          fi

          ARTIFACT_DIR="${RUNNER_TEMP}/apk-artifact"
          mkdir -p "$ARTIFACT_DIR"

          SAFE_VERSION="${VERSION_NAME:-1.0.0}"
          APK_FILENAME="snake-arena-debug-v${SAFE_VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp "$APK_PATH" "${ARTIFACT_DIR}/${APK_FILENAME}"

          (
            cd "$ARTIFACT_DIR"
            sha256sum "$APK_FILENAME" > SHA256SUMS.txt
          )

          APK_SIZE="$(du -h "${ARTIFACT_DIR}/${APK_FILENAME}" | cut -f1)"
          APK_SHA256="$(cut -d' ' -f1 "${ARTIFACT_DIR}/SHA256SUMS.txt")"

          echo "artifact_dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"
          echo "apk_filename=$APK_FILENAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$SAFE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Android Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Snake-Arena-Android-Debug-APK
          path: ${{ steps.verify_apk.outputs.artifact_dir }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo "## Snake Arena — Android Debug APK Build"
            echo ""
            echo "| Property | Value |"
            echo "| :--- | :--- |"
            echo "| **Application ID** | \`${{ steps.verify_apk.outputs.pkg_name }}\` |"
            echo "| **Version** | \`${{ steps.verify_apk.outputs.version_name }}\` (code \`${{ steps.verify_apk.outputs.version_code }}\`) |"
            echo "| **Artifact Name** | \`Snake-Arena-Android-Debug-APK\` |"
            echo "| **APK Filename** | \`${{ steps.verify_apk.outputs.apk_filename }}\` |"
            echo "| **APK Size** | \`${{ steps.verify_apk.outputs.apk_size }}\` |"
            echo "| **SHA-256** | \`${{ steps.verify_apk.outputs.apk_sha256 }}\` |"
            echo "| **Commit** | \`${GITHUB_SHA::12}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Snake-Arena-Android-Build-Diagnostics
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
